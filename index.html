<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070b24">
<title>GAMESET</title>
<style>
:root{--bg:#070b24;--bg2:#10163f;--card:#171e52;--line:#2a3380;--tx:#f3f5ff;--mut:#a3acea;--pur:#8b5cf6;--cy:#22d3ee;--red:#f43f5e;--grn:#34d399;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%}
body{background:radial-gradient(120% 50% at 50% -8%,#2d1b72 0%,transparent 62%),var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,Roboto,sans-serif;overflow:hidden}
#app{height:100%;display:flex;flex-direction:column;max-width:560px;margin:auto}
header{display:flex;align-items:center;justify-content:space-between;padding:10px 14px 6px}
.logo{font-weight:900;font-size:24px;letter-spacing:3px;background:linear-gradient(90deg,var(--cy),var(--pur));-webkit-background-clip:text;background-clip:text;color:transparent}
.hr{display:flex;gap:8px;align-items:center}
.clp{display:flex;align-items:center;gap:7px;background:#ffffff12;border:1px solid var(--line);border-radius:99px;padding:3px 4px 3px 9px;color:var(--tx);font-weight:800;font-size:14px}
.clp i{width:24px;height:24px;border-radius:50%;background:linear-gradient(135deg,var(--cy),var(--pur));color:#06102a;font-style:normal;display:flex;align-items:center;justify-content:center;font-size:17px;line-height:1}
.cl{position:relative;display:flex}
.cl::before{content:"";position:absolute;inset:-5px;border-radius:50%;background:radial-gradient(circle,#22d3eeaa,transparent 66%);animation:gl 2.4s ease-in-out infinite}
.cl img{position:relative}
.bell{width:40px;height:40px;border-radius:12px;background:#ffffff12;border:1px solid var(--line);display:flex;align-items:center;justify-content:center}
.demo{margin:0 14px 4px;padding:5px 10px;border-radius:10px;background:#2a1f5e;color:#c9b8ff;font-size:11px}
main{flex:1;overflow-y:auto;padding:0 14px 18px;scrollbar-width:none}
nav{display:flex;background:#0d1236ee;border-top:1px solid var(--line);backdrop-filter:blur(12px)}
nav button{position:relative;flex:1;background:none;border:0;color:var(--mut);padding:7px 0 6px;font-size:10.5px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:1px;white-space:nowrap}
nav button .ic{opacity:.55;transition:transform .25s,opacity .25s}
nav button.on{color:var(--cy)}
nav button.on .ic{opacity:1;transform:translateY(-2px) scale(1.14);filter:drop-shadow(0 0 7px var(--cy))}
nav button.on::before{content:"";position:absolute;top:0;left:28%;right:28%;height:3px;border-radius:0 0 4px 4px;background:linear-gradient(90deg,var(--cy),var(--pur));box-shadow:0 0 10px var(--cy)}
.ic{display:inline-block;vertical-align:middle;object-fit:contain;flex:none}
h2{font-size:18px;margin:14px 0 8px}
.st{font-size:14px;font-weight:900;letter-spacing:.9px;text-transform:uppercase;margin:20px 0 10px;display:flex;align-items:center;gap:8px}
.st::before{content:"";width:4px;height:16px;border-radius:3px;background:linear-gradient(var(--cy),var(--pur))}
input,textarea{width:100%;background:var(--bg2);border:1px solid var(--line);border-radius:12px;color:var(--tx);padding:11px 13px;font:inherit;outline:none}
input:focus{border-color:var(--cy)}
.sb{display:flex;align-items:center;gap:8px;background:#ffffff0e;border:1px solid var(--line);border-radius:16px;padding:0 12px;height:48px;margin-top:4px}
.sb input{background:none;border:0;padding:0;height:100%;flex:1;border-radius:0}
.sb:focus-within{border-color:var(--cy);box-shadow:0 0 0 3px #22d3ee22}
.cw{position:relative;margin:0 -14px}
.car{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;scroll-behavior:smooth;padding:4px 14px 8px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.car::-webkit-scrollbar,main::-webkit-scrollbar,.chips::-webkit-scrollbar{display:none}
.arr{display:none;position:absolute;top:34px;z-index:2;width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:#10163fe6;color:var(--tx);font-size:18px}
.arr.l{left:6px}.arr.r{right:6px}
@media (pointer:fine){.arr{display:block}}
.ft{flex:none;width:88px;scroll-snap-align:start;text-align:center;transition:transform .18s}
.ft:active{transform:scale(.94)}
.ft b{display:block;font-size:13px;margin-top:7px}
.ft small{font-size:10.5px;color:var(--mut);font-weight:700}
.ft small.g{color:var(--grn)}
.tile{position:relative;width:88px;height:88px;border-radius:22px;background:linear-gradient(160deg,var(--c1),var(--c2));border:1px solid #ffffff2a;box-shadow:0 8px 18px #0007,inset 0 0 18px #ffffff22;display:flex;align-items:flex-end;justify-content:center;overflow:hidden}
.tile svg{animation:bob 3.2s ease-in-out infinite}
.tile.sm{width:46px;height:46px;border-radius:14px}.tile.sm svg{animation:none}
.tile.big{width:116px;height:116px;margin:0 auto 8px;border-radius:28px}
.tile .od{position:absolute;top:6px;right:6px}
.od{width:12px;height:12px;border-radius:50%;background:#5b628f;border:2px solid #0b1030;display:inline-block;flex:none}
.od.on{background:var(--grn);box-shadow:0 0 8px var(--grn)}
.od.s{margin-right:5px;width:9px;height:9px;border:0}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 12px;scrollbar-width:none}
.chip{flex:none;padding:7px 16px;border-radius:99px;background:#ffffff0e;border:1px solid var(--line);color:var(--mut);font-size:13px;font-weight:700;transition:transform .15s}
.chip:active{transform:scale(.93)}
.chip.on{background:linear-gradient(90deg,var(--pur),var(--cy));color:#06102a;border-color:transparent;box-shadow:0 0 14px #22d3ee55}
.gc,.fp{background:var(--card);border-radius:20px;overflow:hidden;border:1px solid var(--line);margin-bottom:14px;box-shadow:0 8px 22px #0006;transition:transform .18s}
.gc:active,.fp:active{transform:scale(.975)}
.ga,.fpa{position:relative;height:150px}
.fpa{height:124px}
.ga svg,.fpa svg{width:100%;height:100%;display:block}
.ga::after,.fpa::after{content:"";position:absolute;inset:auto 0 0 0;height:55%;background:linear-gradient(transparent,#070b24aa);pointer-events:none}
.gb,.gp{position:absolute;top:10px;z-index:1;font-size:11px;font-weight:800;padding:4px 10px;border-radius:99px;background:#070b24b3;backdrop-filter:blur(6px)}
.gb{left:10px;color:var(--cy)}.gp{right:10px;color:#fde68a}.gp.f{color:var(--grn)}
.gi{padding:11px 14px 14px}
.gi b{font-size:17px}
.gi p{color:var(--mut);font-size:13px;margin:2px 0 8px}
.gi small{display:flex;align-items:center;color:var(--grn);font-weight:700;font-size:12px}
.fpv{position:absolute;left:10px;bottom:8px;z-index:1;display:flex}
.mini{width:36px;height:36px;border-radius:12px;background:linear-gradient(160deg,var(--pur),var(--cy));border:2px solid #0b1030;margin-right:-8px;overflow:hidden;display:flex;align-items:flex-end;justify-content:center}
.fpb{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 14px}
.fpb b{display:block;font-size:16px}.fpb small{color:var(--mut);font-size:12px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:14px;padding:12px 16px;font-weight:800;color:#06102a;background:linear-gradient(90deg,var(--cy),var(--pur));font-size:14px;width:100%;transition:transform .15s,box-shadow .15s;box-shadow:0 4px 14px #22d3ee33}
.btn:active{transform:scale(.95)}
.btn[disabled]{opacity:.5;box-shadow:none}
.btn.sec{background:var(--bg2);color:var(--tx);border:1px solid var(--line);box-shadow:none}
.btn.sm{padding:8px 14px;width:auto;font-size:12.5px;flex:none}
.big{margin-top:18px;padding:16px;font-size:16px;border-radius:18px;box-shadow:0 0 22px #22d3ee66}
.row{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px 12px;margin-bottom:9px;transition:transform .15s}
.row:active{transform:scale(.98)}
.row .g{flex:1;min-width:0}
.row small{color:var(--mut);display:flex;align-items:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.empty{text-align:center;color:var(--mut);margin:26px 0}
.hero{background:linear-gradient(135deg,var(--pur),var(--cy));border-radius:20px;padding:16px;color:#06102a;margin:10px 0}
.hero.dk{background:linear-gradient(135deg,#1b2260,#2a1d68);color:var(--tx);border:1px solid var(--line)}
.fl{display:flex;gap:12px;align-items:center}
.mod{position:fixed;inset:0;background:#000a;display:flex;align-items:flex-end;justify-content:center;z-index:9;animation:fd .2s}
.sheet{background:var(--bg2);border-radius:24px 24px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));width:100%;max-width:560px;border-top:2px solid var(--pur);max-height:88%;overflow:auto;animation:sh .3s cubic-bezier(.2,.8,.2,1)}
.sheet h3{margin-bottom:6px}.sheet p{color:var(--mut);margin-bottom:12px}.sheet .btn{margin-top:8px}
.chat{display:flex;flex-direction:column;height:calc(var(--ah,100vh) - 215px);min-height:240px}
.msgs{flex:1;overflow-y:auto;padding:8px 0}
.m{max-width:78%;padding:8px 12px;border-radius:16px;margin:4px 0;background:var(--card);word-wrap:break-word}
.m.me{margin-left:auto;background:linear-gradient(135deg,var(--pur),#4f46e5)}
.m img{max-width:100%;border-radius:10px;display:block}
.m i{display:block;font-size:10px;color:var(--mut);font-style:normal}
.bar{display:flex;gap:8px;padding:8px 0;align-items:center}
.ico{flex:none;width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--bg2);color:var(--tx);font-size:18px;display:flex;align-items:center;justify-content:center}
.back{background:none;border:0;color:var(--cy);font-size:15px;padding:8px 0;font-weight:700}
.plan{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
.plan.best{border-color:var(--cy)}.plan b{font-size:17px}
.sw{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.tg{width:46px;height:26px;border-radius:99px;background:#3a4280;border:0;position:relative;transition:background .2s}
.tg::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .2s}
.tg.on{background:var(--cy)}.tg.on::after{transform:translateX(20px)}
.code{font-size:34px;font-weight:900;letter-spacing:6px;text-align:center;margin:10px 0}
.qk{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0}
.qk button{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px 2px 8px;color:var(--tx);font-size:11.5px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:3px;transition:transform .15s}
.qk button:active{transform:scale(.92)}
.sdot{display:inline-block;width:14px;height:14px;border-radius:50%;vertical-align:-2px}
.ctr{text-align:center}
.pav{width:112px;height:112px;margin:16px auto 6px;border-radius:30px;background:linear-gradient(160deg,var(--pur),var(--cy));box-shadow:0 0 28px #22d3ee55;display:flex;align-items:flex-end;justify-content:center;overflow:hidden}
.pg .rv{animation:up .45s cubic-bezier(.2,.8,.2,1) both}
@keyframes up{from{opacity:0;transform:translate(var(--dx,0),16px)}}
.pg.r{--dx:24px}.pg.l{--dx:-24px}
@keyframes sh{from{transform:translateY(100%)}}
@keyframes fd{from{opacity:0}}
@keyframes gl{50%{opacity:.35;transform:scale(1.3)}}
@keyframes bob{50%{transform:translateY(-3px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
#pk{position:fixed;inset:0;z-index:8;background:#070b24;touch-action:none;user-select:none;-webkit-user-select:none}
#pkc{position:absolute;inset:0}#pkc canvas{display:block;width:100%;height:100%}
.hud{position:absolute;left:0;right:0;top:0;display:flex;gap:8px;align-items:flex-start;justify-content:space-between;padding:calc(10px + env(safe-area-inset-top,0px)) 12px 0;pointer-events:none}
.hud>*{pointer-events:auto}
.hb{background:#0d1236cc;border:1px solid var(--line);color:var(--tx);border-radius:12px;padding:8px 12px;font-weight:700;font-size:13px;backdrop-filter:blur(6px)}
.hp{background:#0d1236cc;border:1px solid var(--line);border-radius:14px;padding:6px 12px;text-align:center;backdrop-filter:blur(6px)}
.hp b{display:block;font-size:17px}.hp small{color:var(--mut);font-size:11px}
.zm{position:absolute;right:12px;top:calc(100px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:8px}
.zm .hb{width:42px;height:42px;padding:0;font-size:22px}
#pkj{display:none;position:absolute;width:110px;height:110px;border-radius:50%;background:#ffffff14;border:2px solid #ffffff44;pointer-events:none}
#pkj i{position:absolute;left:32px;top:32px;width:46px;height:46px;border-radius:50%;background:linear-gradient(135deg,var(--cy),var(--pur));box-shadow:0 0 14px var(--cy)}
#pkjump{position:absolute;right:22px;bottom:calc(34px + env(safe-area-inset-bottom,0px));width:92px;height:92px;border-radius:50%;border:2px solid #ffffff55;background:radial-gradient(circle at 35% 30%,#7dd3fc,var(--pur));color:#fff;font-weight:900;font-size:14px;box-shadow:0 0 22px #8b5cf688;transition:transform .1s}
#pkjump.on{transform:scale(.9)}
#pktoast{position:absolute;top:24%;left:50%;transform:translateX(-50%);opacity:0;padding:10px 20px;border-radius:99px;background:linear-gradient(90deg,var(--pur),var(--cy));color:#06102a;font-weight:900;pointer-events:none;white-space:nowrap}
#pktoast.show{animation:tst 1.7s ease both}
@keyframes tst{0%{opacity:0;transform:translate(-50%,16px) scale(.8)}12%,75%{opacity:1;transform:translate(-50%,0) scale(1)}100%{opacity:0;transform:translate(-50%,-12px)}}
#pkload{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:#070b24;color:var(--mut);padding:20px;z-index:2}
#pkhint{position:absolute;left:0;right:0;bottom:calc(150px + env(safe-area-inset-bottom,0px));text-align:center;color:#fff;font-size:12px;text-shadow:0 1px 4px #000;pointer-events:none;animation:hintf 7s both}
@keyframes hintf{0%,80%{opacity:.9}100%{opacity:0}}
@keyframes pop{from{opacity:0;transform:scale(.4) rotate(-6deg)}}
.row.mine{border-color:var(--cy);box-shadow:0 0 14px #22d3ee44}
.fi{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 8%;display:block}
.tile.sm .fi{position:static}
.pav2{width:150px;height:190px;margin:12px auto 4px;display:flex;align-items:flex-end;justify-content:center;border-radius:28px;background:radial-gradient(circle at 50% 70%,#7c3aed88,transparent 70%);position:relative}
.pav2 img{max-height:100%;max-width:100%;animation:flt 3s ease-in-out infinite;filter:drop-shadow(0 8px 14px #0008)}
.swb{position:relative;overflow:hidden;margin:6px auto 0;display:inline-flex;align-items:center;gap:8px;border:0;border-radius:99px;padding:11px 22px;font-weight:900;font-size:14px;color:#06102a;background:linear-gradient(90deg,var(--cy),var(--pur),var(--cy));background-size:200% 100%;animation:flow 3s linear infinite,pls 2.4s ease-in-out infinite}
.swb svg{animation:spn 2.4s ease-in-out infinite}
.swb::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,#fffa,transparent);transform:skewX(-20deg);animation:shn 2.6s ease-in-out infinite}
.swb:active{transform:scale(.94)}
@keyframes flow{to{background-position:200% 0}}@keyframes pls{50%{box-shadow:0 0 24px #22d3eeaa}}@keyframes shn{to{left:130%}}@keyframes spn{50%{transform:rotate(180deg)}}
.cp{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:10px 0}
.cc{background:linear-gradient(160deg,#1b2260,#2a1d68);border:2px solid var(--line);border-radius:22px;padding:10px 6px 12px;text-align:center;animation:ccin .6s cubic-bezier(.2,1.3,.4,1) both;transition:transform .2s,border-color .2s,box-shadow .2s}
.cc.sel{border-color:var(--cy);box-shadow:0 0 24px #22d3ee77;transform:translateY(-4px)}
.cc:active{transform:scale(.95)}
.cc small{display:block;color:var(--mut);font-size:12px}.cc.sel small{color:var(--cy);font-weight:800}
.cim{height:200px;display:flex;align-items:flex-end;justify-content:center;margin-bottom:6px}
.cim img{max-height:100%;max-width:100%;animation:flt 3s ease-in-out infinite;filter:drop-shadow(0 6px 10px #0009)}
.cc:nth-child(2) img{animation-delay:-1.5s}
@keyframes ccin{from{opacity:0;transform:translateY(70px) scale(.7) rotate(-6deg)}}@keyframes flt{50%{transform:translateY(-7px)}}
.hud{padding:calc(8px + env(safe-area-inset-top,0px)) 14px 0}
.hp{padding:4px 12px}.hp b{font-size:15px}
.zm{top:62px;right:14px}.zm .hb{width:38px;height:38px;font-size:20px}
#pkjump{right:36px;bottom:24px;width:86px;height:86px}
#pkhint{bottom:calc(62px + env(safe-area-inset-bottom,0px))}

.hp{display:flex;flex-direction:column;align-items:center;gap:1px}.hp.ex{flex-direction:row;gap:6px}
.hb,.hp{background:linear-gradient(#0d1236f2,#0d1236f2) padding-box,linear-gradient(90deg,#f43f5e,#fbbf24,#34d399,#22d3ee,#8b5cf6) border-box;border:2px solid transparent;border-radius:14px;color:#fff}
.hb.ex{display:flex;align-items:center;gap:6px;font-weight:800}
.hp b{font-size:15px;background:linear-gradient(90deg,#fde047,#f472b6,#22d3ee);-webkit-background-clip:text;background-clip:text;color:transparent}
.hp small{display:flex;align-items:center;gap:3px;color:#e0e7ff;font-weight:700}
.lm{position:absolute;left:max(10px,env(safe-area-inset-left,0px));top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:10px;pointer-events:none}
.tm,.xpb{display:flex;align-items:center;gap:8px;padding:8px 14px 8px 10px;border-radius:18px;color:#fff;background:linear-gradient(#0d1236f2,#0d1236f2) padding-box,linear-gradient(90deg,#f43f5e,#fbbf24,#34d399,#22d3ee,#8b5cf6,#f43f5e) border-box;background-size:100% 100%,300% 100%;border:2.5px solid transparent;animation:rbf 5s linear infinite;box-shadow:0 6px 18px #0008}
.tm b{font-size:24px;letter-spacing:1px;font-variant-numeric:tabular-nums;background:linear-gradient(90deg,#67e8f9,#f0abfc,#fde047);-webkit-background-clip:text;background-clip:text;color:transparent}
.tm svg{animation:wig 2.4s ease-in-out infinite}
.xpb div{min-width:104px}.xpb b{display:block;font-size:13px;color:#fde047}
.xpb i{display:block;height:9px;border-radius:9px;background:#ffffff26;overflow:hidden;margin-top:3px}
.xpb u{display:block;height:100%;width:0;border-radius:9px;background:linear-gradient(90deg,#34d399,#fde047,#f43f5e);transition:width .4s}
@keyframes rbf{to{background-position:0 0,300% 0}}@keyframes wig{0%,100%{transform:rotate(-9deg)}50%{transform:rotate(9deg)}}
.zm .hb{font-size:26px;font-weight:900;display:flex;align-items:center;justify-content:center}
#pkrb{position:absolute;left:50%;bottom:calc(12px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:flex;align-items:center;gap:8px;padding:8px 18px;border:0;border-radius:99px;font-weight:900;font-size:14px;color:#fff;background:linear-gradient(90deg,#7c3aed,#db2777);box-shadow:0 4px 18px #7c3aed99}
#pkrb.rdy{background:linear-gradient(90deg,#f43f5e,#fbbf24,#34d399,#22d3ee,#8b5cf6);background-size:200% 100%;color:#06102a;animation:rdy 1.1s ease-in-out infinite,flow 2.5s linear infinite}
@keyframes rdy{50%{transform:translateX(-50%) scale(1.12);box-shadow:0 0 28px #fbbf24}}
#pkjump{isolation:isolate;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;background:radial-gradient(circle at 35% 30%,#fde68a,#f472b6 55%,#8b5cf6);border:0;color:#fff;text-shadow:0 1px 3px #0008}
#pkjump::before{content:"";position:absolute;inset:-5px;border-radius:50%;background:conic-gradient(#f43f5e,#fbbf24,#34d399,#22d3ee,#8b5cf6,#f43f5e);animation:spin 4s linear infinite;z-index:-1}
@keyframes spin{to{transform:rotate(360deg)}}
.xpf{position:absolute;left:max(70px,calc(env(safe-area-inset-left,0px) + 60px));top:36%;display:flex;gap:6px;align-items:center;font-weight:900;font-size:26px;pointer-events:none;animation:xpup 1.4s ease-out both}
.xpf span{background:linear-gradient(90deg,#fde047,#fb923c,#f43f5e);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 2px 3px #000a)}
@keyframes xpup{0%{opacity:0;transform:translateY(24px) scale(.6)}15%{opacity:1;transform:scale(1.15)}100%{opacity:0;transform:translateY(-80px)}}
.rec{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:6px 0 10px}

/* No landscape styling is applied to the GAMESET app shell. */

#modal,#modal2{pointer-events:none}

.hb,.hp{touch-action:manipulation}
/* HUD: SHOP button (right side, just under the top bar / front camera area) */
.zm{top:calc(96px + env(safe-area-inset-top,0px));right:max(12px,env(safe-area-inset-right,0px));flex-direction:row;gap:6px}

.pgrid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}

.shd{position:sticky;top:-18px;z-index:4;margin:-18px -18px 8px;padding:14px 18px 6px;background:var(--bg2);border-radius:24px 24px 0 0}
.shd .shh{gap:10px}.shd .chips{padding-bottom:6px}
.shs{scroll-margin-top:96px;margin-bottom:14px}
.shs h4{display:flex;align-items:center;gap:8px;font-size:17px;letter-spacing:2px;margin:6px 0 10px;background:linear-gradient(90deg,#67e8f9,#c084fc,#fde047);-webkit-background-clip:text;background-clip:text;color:transparent}
.spg{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.tlg{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.spc,.tlc{position:relative;display:flex;flex-direction:column;align-items:center;gap:5px;text-align:center;padding:12px 8px 10px;border-radius:20px;border:2px solid #4c3fb8;background:radial-gradient(120% 90% at 50% 0%,#3b2a9a 0%,#1b2260 55%,#141a4d 100%);box-shadow:0 8px 20px #0007,inset 0 0 22px #8b5cf622;transition:transform .15s,box-shadow .2s}
.spc:active,.tlc:active{transform:scale(.97)}
.spc.act,.tlc.act{border-color:#fbbf24;box-shadow:0 0 22px #fbbf2466,inset 0 0 22px #fbbf2422}
.spc.own,.tlc.own{border-color:#22d3ee}.spc.act.own,.tlc.act.own{border-color:#fbbf24}
.spc small,.tlc small{color:var(--mut);font-size:11px;line-height:1.25}
.spi{width:74px;height:74px;border-radius:24px;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 35% 30%,#7dd3fc,#6d28d9 70%);box-shadow:0 0 20px #22d3ee66,inset 0 0 14px #fff4;animation:bob 3s ease-in-out infinite}
.spx{font-size:19px;font-weight:900;background:linear-gradient(90deg,#fde047,#fb923c);-webkit-background-clip:text;background-clip:text;color:transparent}
.spx2{font-size:12px;font-weight:800;color:#a5f3fc}
.stc{font-size:10.5px;font-weight:800;padding:2px 10px;border-radius:99px;background:#ffffff14;color:var(--mut)}
.stc.on{background:#064e3b;color:#6ee7b7;box-shadow:0 0 10px #34d39955}.stc.mid{color:#93c5fd}
.spc .btn,.tlc .btn{width:100%;margin-top:auto}
.btn.go{background:linear-gradient(90deg,#fbbf24,#f97316);animation:pls 1.8s ease-in-out infinite}
#shopmsg{min-height:16px;color:#6ee7b7;font-weight:700}
.tp{position:relative;width:100%;height:56px;border-radius:14px;background:linear-gradient(160deg,#0b1030,#1a1450);overflow:hidden}
.tp .ch{position:absolute;right:14px;top:11px;width:28px;height:34px;border-radius:12px 12px 8px 8px;background:linear-gradient(160deg,#a78bfa,#22d3ee);box-shadow:0 0 10px #22d3ee88}
.tp .tr{position:absolute;left:0;right:40px;top:14px;height:28px;clip-path:polygon(0 50%,100% 8%,100% 92%);background:var(--tg);filter:drop-shadow(0 0 6px var(--tgs))}
.tp .d{position:absolute;width:5px;height:5px;border-radius:50%;background:var(--tgd);box-shadow:0 0 6px var(--tgd);animation:tw 1.5s ease-in-out infinite}
.tp .d1{left:18%;top:10px}.tp .d2{left:34%;top:38px;animation-delay:-.4s}.tp .d3{left:52%;top:8px;animation-delay:-.8s}.tp .d4{left:70%;top:42px;animation-delay:-1.1s}
@keyframes tw{0%,100%{opacity:.15;transform:scale(.5) translateX(0)}50%{opacity:1;transform:scale(1.2) translateX(-6px)}}
.tp-white{--tg:linear-gradient(90deg,#fff0,#ffffffcc 60%,#fff);--tgs:#fff;--tgd:#fff}
.tp-brown{--tg:linear-gradient(90deg,#0000,#a0612a 50%,#fbbf24);--tgs:#fbbf24;--tgd:#fcd34d}
.tp-blue{--tg:linear-gradient(90deg,#0000,#2563eb 45%,#22d3ee);--tgs:#22d3ee;--tgd:#67e8f9}
.tp-purple{--tg:linear-gradient(90deg,#0000,#7c3aed 45%,#e879f9);--tgs:#c084fc;--tgd:#f0abfc}
.tp-rainbow{--tg:linear-gradient(90deg,#0000,#f43f5e,#fbbf24,#34d399,#22d3ee,#8b5cf6);--tgs:#fff;--tgd:#fff}
.tp-rainbow .tr{animation:hue 3s linear infinite}
@keyframes hue{to{filter:hue-rotate(360deg) drop-shadow(0 0 6px #fff)}}
/* treasure + result banner */
.rwd{position:absolute;left:50%;top:36%;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;pointer-events:none;z-index:6;animation:rwdA 2.7s cubic-bezier(.2,1.2,.3,1) both}
.rwd span{font-size:56px;font-weight:900;letter-spacing:2px;background:linear-gradient(180deg,#fff7ae,#fbbf24 55%,#f97316);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 6px #000a)}
.rwd small{font-weight:900;letter-spacing:7px;color:#fde68a;text-shadow:0 2px 6px #000}
@keyframes rwdA{0%{opacity:0;transform:translate(-50%,-30%) scale(.3)}14%{opacity:1;transform:translate(-50%,-50%) scale(1.25)}24%{transform:translate(-50%,-50%) scale(1)}80%{opacity:1;transform:translate(-50%,-62%) scale(1)}100%{opacity:0;transform:translate(-50%,-90%) scale(1)}}
.gflash{position:absolute;inset:0;background:radial-gradient(circle at 50% 55%,#fff8,#fde04755 40%,transparent 70%);pointer-events:none;z-index:5;animation:fd .9s ease-out reverse both}
#pkres{position:absolute;top:calc(8px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);z-index:6;padding:8px 24px;border-radius:18px;text-align:center;color:#fff;background:linear-gradient(#0d1236f0,#0d1236f0) padding-box,linear-gradient(90deg,#f43f5e,#fbbf24,#34d399,#22d3ee,#8b5cf6) border-box;border:2.5px solid transparent;box-shadow:0 8px 24px #000a;pointer-events:none;animation:resin .5s both}
@keyframes resin{from{opacity:0;transform:translate(-50%,-16px)}}
#pkres b{display:block;font-size:26px;font-variant-numeric:tabular-nums;background:linear-gradient(90deg,#67e8f9,#f0abfc,#fde047);-webkit-background-clip:text;background-clip:text;color:transparent}
#pkres span{font-size:12px;font-weight:800;color:#fde68a}
.recg{font-size:12px;color:var(--mut)}

/* game info sheet (layout from the marked screenshot) */
.gv2{position:relative;display:flex;flex-direction:column;gap:12px;min-width:0}.gv2 *{min-width:0}
.xcl{position:absolute;top:-8px;right:-8px;width:30px;height:30px;padding:0;border-radius:50%;border:1px solid var(--line);background:var(--bg2);color:#fff;font-size:20px;line-height:1;z-index:2}
.gtop{display:flex;gap:12px;align-items:flex-start;padding-right:18px}
.gimg{flex:none;width:60%;aspect-ratio:16/9;border-radius:16px;overflow:hidden;box-shadow:0 8px 22px #0007;background:var(--card)}
.gimg img,.gimg svg{width:100%;height:100%;object-fit:cover;display:block}
.gtxt{flex:1}.gtxt h3{font-size:20px;line-height:1.15;margin:0 0 4px}.gtxt p{font-size:13px;margin:0 0 6px;color:var(--mut)}
.glk{display:flex;gap:10px}.glk button{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;padding:11px 6px;border-radius:14px;border:1px solid var(--line);background:var(--bg2);color:#fff;font-weight:800;font-size:15px;transition:transform .12s}
.glk button:active{transform:scale(.94)}.glk .on.up{border-color:#34d399;background:#064e3b}.glk .on.dn{border-color:#fb7185;background:#4c0519}
.gbot{display:flex;gap:12px;align-items:stretch}
.gbot .fsq{width:68px;height:68px;flex:none;padding:0;margin:0;border-radius:18px;position:relative}
.fsq b{position:absolute;top:-6px;right:-4px;background:#f43f5e;border-radius:99px;font-size:11px;padding:1px 6px;color:#fff}
.gbot .playb2{flex:1;width:auto;height:68px;margin:0;font-size:26px;font-weight:900;letter-spacing:4px;color:#fff;border-radius:20px;background:linear-gradient(90deg,#10b981,#06b6d4,#8b5cf6);box-shadow:0 0 28px #22d3ee88,0 6px 0 #0e7490;animation:ppl 1.6s ease-in-out infinite}
.gbot .playb2:active{transform:translateY(4px);box-shadow:0 0 28px #22d3ee88,0 2px 0 #0e7490;animation:none}
@keyframes ppl{50%{box-shadow:0 0 42px #22d3eecc,0 6px 0 #0e7490}}
.note2{color:var(--mut);font-size:10.5px;text-align:center}
@media (max-height:480px){.gimg{width:40%}.gtxt h3{font-size:18px}.gbot .playb2,.gbot .fsq{height:56px}.gbot .fsq{width:56px}.gv2{gap:8px}}

/* v5 */
#atoast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%) translateY(20px);background:#12183f;color:#fff;border:1px solid var(--line);padding:10px 18px;border-radius:99px;font-weight:800;font-size:13px;opacity:0;pointer-events:none;z-index:99999;max-width:90vw;text-align:center}
#atoast.show{animation:atp 2.6s ease forwards}@keyframes atp{0%{opacity:0;transform:translateX(-50%) translateY(20px)}12%,80%{opacity:1;transform:translateX(-50%) translateY(0)}100%{opacity:0}}
.stc{font-size:11px;font-weight:800;padding:3px 9px;border-radius:99px;background:color-mix(in srgb,var(--sc) 22%,transparent);color:var(--sc);border:1px solid var(--sc);white-space:nowrap}
.m.sys{align-self:center;max-width:94%;background:#ffffff10;border:1px dashed var(--line);white-space:pre-line;font-size:13px}
.m{white-space:pre-wrap}
.ohd{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 4px}.ohd small{display:block;color:var(--mut)}
.oact{display:flex;gap:6px;padding:6px 0}.oact .btn{flex:1;margin:0}
.pmb.on{outline:2px solid var(--cy)}
textarea{width:100%;background:var(--card);color:var(--tx);border:1px solid var(--line);border-radius:12px;padding:10px;font:inherit;margin-bottom:10px;box-sizing:border-box}
#pkwheel,#pkcarpet{position:absolute;display:flex;align-items:center;gap:8px;font-weight:900;color:#fff}
#pkwheel{left:50%;top:66%;transform:translateX(-50%);padding:9px 20px;border-radius:99px;border:2px solid #fff;font-size:14px;background:linear-gradient(90deg,#f59e0b,#ef4444,#8b5cf6);box-shadow:0 0 22px #f59e0b88;animation:eggp 1.2s ease-in-out infinite}
#pkwheel[hidden],#pkcarpet[hidden]{display:none}
#pkcarpet{left:50%;top:70px;transform:translateX(-50%);padding:6px 14px;border-radius:99px;background:#b91c1ccc;border:2px solid #fde047;font-size:13px}
</style>

/* ===== RAINBOW PARKOUR v3: real 3D (three.js r128) + multiplayer (room) + progress (db) ===== */
const PKC={HW:0.36,H:2.3,SP:9,JV:12.5,G:32,CAP:20,PAD:21,CPS:100,CAPSPD:1,CAPCUBE:15,XPERX:.01,TREASURE:100000};

const rng=seed=>()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};

/* ---- MAP: deterministic, 100 checkpoints, 4 worlds. Very easy start, difficulty rises step by step ---- */
const ZONES=[
 {id:"sky",name:"Sky World",col:0x9bdcff,wmin:5,wmax:8,gap:[2,3.4],lat:5},
 {id:"neon",name:"Neon City",col:0x14083a,wmin:4,wmax:6.5,gap:[2.2,3.8],lat:5.5},
 {id:"nature",name:"Nature World",col:0xbfe8d0,wmin:3.6,wmax:6,gap:[2.4,4],lat:6},
 {id:"lava",name:"Lava World",col:0x3a0d06,wmin:3.4,wmax:5,gap:[2.6,4.1],lat:6,kill:1}];
/* obstacle: m = first checkpoint where it may appear, w = weight per world, d = difficulty (0..3) */
const OBD={plain:{m:1,w:[2,1,1,1],d:0},stairs:{m:1,w:[2,1,2,1],d:0},zig:{m:8,w:[2,1,1,1],d:1},mv:{m:8,w:[2,2,1,1],d:1},spiral:{m:10,w:[1,1,2,1],d:1},pad:{m:16,w:[1,1,1,1],d:1},beam:{m:18,w:[1,0,2,1],d:2},blink:{m:24,w:[0,2,0,2],d:2},spin:{m:32,w:[0,2,0,2],d:3}};
const xpFor=c=>c<=8?200:200+Math.round((c-8)/92*80)*10;           /* 200 .. 1000 XP */
const trFor=(d,zi)=>{const s=d+zi;return s<=1?1:s<=3?10:100};     /* 1 / 10 / 100 trophies */
function buildMap(){
 const R=rng(20260707),boxes=[],cps=[],kills=[],spins=[],pillars=[],zr=[];let spirals=0,dk=0,dif=0;
 const add=o=>{o.x0=o.x-o.w/2;o.x1=o.x+o.w/2;o.z0=o.z-o.d/2;o.z1=o.z+o.d/2;o.y1=o.y;o.y0=o.y-o.h;o.i=boxes.length;boxes.push(o);return o};
 let cur={x:0,y:0,z:0,w:44,d:44};
 add({x:0,y:0,z:0,w:44,d:44,h:1,kind:"start",zone:0});
 cps.push({x:0,y:0,z:0,rz:-12,i:0,zone:0,w:44,d:44,xp:0,tr:0});
 const gate={x:0,y:8,z:21.6,w:44,d:.8,h:9};gate.x0=-22;gate.x1=22;gate.z0=gate.z-.4;gate.z1=gate.z+.4;gate.y1=8;gate.y0=-1;
 const pickDy=()=>{const L=dk<.15?[-.4,0,0,.3]:cur.y>24?[-1.2,-.8,-.4,0]:cur.y<-4?[0,.5,1,1.3]:[-.8,0,0,0,.5,1,1.3];return L[Math.floor(R()*L.length)]};
 const plat=(zi,o={})=>{const Z=ZONES[zi];
  const w=o.w||lerp(7,Z.wmin,dk)+R()*(lerp(9.5,Z.wmax,dk)-lerp(7,Z.wmin,dk)),d=o.d||lerp(7,Z.wmin,dk)+R()*(lerp(9.5,Z.wmax,dk)-lerp(7,Z.wmin,dk)),dy=o.dy!==undefined?o.dy:pickDy();

function normProf(d){const b=newProf();d=d||{};
 for(const k of ["best","last","count","lv","xp","rb","tr","trTot","maxCp","upd"])b[k]=Math.max(0,+d[k]||0);
 b.lv=Math.max(1,Math.floor(b.lv));b.trTot=Math.max(b.trTot,b.tr);
 if(d.pets)for(const p of PETS)b.pets[p.id]=Math.max(0,Math.floor(+d.pets[p.id]||0));
 const eq=Array.isArray(d.eq)?d.eq:(d.ep?[d.ep]:[]),used={};
 for(let i=0;i<3;i++){const id=eq[i];if(id&&petOf(id)&&b.pets[id]>0&&!used[id]){b.eq[i]=id;used[id]=1}}
 if(d.eggs)for(const k of ["e1","e2","e3"])b.eggs[k]=Math.max(0,Math.floor(+d.eggs[k]||0));
 if(d.auto)for(const k of ["e2","e3"])b.auto[k]=d.auto[k]?1:0;
 b.e3f=d.e3f?1:0;
 if(d.spk)for(const k of SPK)b.spk[k.id]=d.spk[k.id]?1:0;
 b.spa=SPK.some(k=>k.id===d.spa&&b.spk[k.id])?d.spa:"";
 if(d.tails)for(const k of TAILS)b.tails[k.id]=d.tails[k.id]?1:0;

function sprTex(kind){const c=document.createElement("canvas");c.width=c.height=64;const x=c.getContext("2d");
 if(kind==="star"){const g=x.createRadialGradient(32,32,0,32,32,20);g.addColorStop(0,"rgba(255,255,255,.9)");g.addColorStop(1,"rgba(255,255,255,0)");x.fillStyle=g;x.fillRect(0,0,64,64);x.fillStyle="#fff";x.beginPath();for(let i=0;i<8;i++){const r=i%2?6:30,a=-Math.PI/2+i*Math.PI/4;x.lineTo(32+Math.cos(a)*r,32+Math.sin(a)*r)}x.closePath();x.fill()}
 else{const g=x.createRadialGradient(32,32,0,32,32,30);g.addColorStop(0,"rgba(255,255,255,1)");g.addColorStop(.4,"rgba(255,255,255,.55)");g.addColorStop(1,"rgba(255,255,255,0)");x.fillStyle=g;x.fillRect(0,0,64,64)}

function hsl2rgb(h,s,l){const a=s*Math.min(l,1-l),f=n=>{const k=(n+h*12)%12;return l-a*Math.max(-1,Math.min(k-3,9-k,1))};return[f(0),f(8),f(4)]}
const lerp3=(a,b,t)=>[lerp(a[0],b[0],t),lerp(a[1],b[1],t),lerp(a[2],b[2],t)];
const TSTY={
 white:{life:.8,w:.34,int:.95,ps:.38,rate:34,star:0,col:(u)=>lerp3([1,1,1],[.78,.9,1],u),pc:[[1,1,1],[.85,.93,1]]},
 brown:{life:.9,w:.38,int:1,ps:.42,rate:30,star:0,col:(u)=>lerp3([1,.8,.28],[.55,.32,.14],u),pc:[[1,.8,.3],[.7,.45,.2]]},
 blue:{life:.9,w:.46,int:1.25,ps:.5,rate:44,star:0,col:(u)=>lerp3([.25,.9,1],[.1,.3,1],u),pc:[[.3,.9,1],[.4,.6,1]]},
 purple:{life:1,w:.44,int:1.1,ps:.55,rate:46,star:1,col:(u)=>lerp3([.9,.4,1],[.35,.1,.85],u),pc:[[.85,.4,1],[1,.7,1],[.5,.3,1]]},
 rainbow:{life:1.05,w:.52,int:1.15,ps:.6,rate:64,star:1,col:(u,tm)=>hsl2rgb(((u*.9+tm*.6)%1+1)%1,1,.55),pc:null}};
function initTrail(){const T=THREE,tr=PK.tr={hist:[],acc:0,still:0,id:"",em:0};
 tr.pos=new Float32Array(TN*4*3);tr.col=new Float32Array(TN*4*3);const idx=[];
 for(let s=0;s<2;s++){const b=s*TN*2;for(let k=0;k<TN-1;k++){const a=b+k*2;idx.push(a,a+1,a+2,a+1,a+3,a+2)}}
 const g=new T.BufferGeometry();g.setAttribute("position",new T.BufferAttribute(tr.pos,3));g.setAttribute("color",new T.BufferAttribute(tr.col,3));g.setIndex(idx);
 tr.mesh=new T.Mesh(g,new T.MeshBasicMaterial({vertexColors:true,transparent:true,blending:T.AdditiveBlending,depthWrite:false,side:T.DoubleSide,fog:false}));tr.mesh.frustumCulled=false;tr.mesh.visible=false;PK.scene.add(tr.mesh);
 const mk=(kind)=>{const N=140,o={N,i:0,pos:new Float32Array(N*3).fill(-999),col:new Float32Array(N*3),b:new Float32Array(N*3),v:new Float32Array(N*3),l:new Float32Array(N),m:new Float32Array(N)},gg=new T.BufferGeometry();
  gg.setAttribute("position",new T.BufferAttribute(o.pos,3));gg.setAttribute("color",new T.BufferAttribute(o.col,3));
  o.pts=new T.Points(gg,new T.PointsMaterial({size:.5,map:sprTex(kind),vertexColors:true,transparent:true,blending:T.AdditiveBlending,depthWrite:false,fog:false}));o.pts.frustumCulled=false;o.pts.visible=false;PK.scene.add(o.pts);return o};
 tr.soft=mk("soft");tr.star=mk("star")}
function trSpawn(o,x,y,z,vx,vy,vz,c,life){const i=o.i=(o.i+1)%o.N,j=i*3;o.pos[j]=x;o.pos[j+1]=y;o.pos[j+2]=z;o.v[j]=vx;o.v[j+1]=vy;o.v[j+2]=vz;o.b[j]=c[0];o.b[j+1]=c[1];o.b[j+2]=c[2];o.l[i]=o.m[i]=life}
function trStep(o,dt){for(let i=0;i<o.N;i++){if(o.l[i]>0){o.l[i]-=dt;const j=i*3;if(o.l[i]<=0){o.pos[j+1]=-999;o.col[j]=o.col[j+1]=o.col[j+2]=0}else{const f=o.l[i]/o.m[i];o.pos[j]+=o.v[j]*dt;o.pos[j+1]+=o.v[j+1]*dt;o.pos[j+2]+=o.v[j+2]*dt;o.col[j]=o.b[j]*f;o.col[j+1]=o.b[j+1]*f;o.col[j+2]=o.b[j+2]*f}}}
 o.pts.geometry.attributes.position.needsUpdate=true;o.pts.geometry.attributes.color.needsUpdate=true}
function updTrail(dt,moving){const tr=PK.tr;if(!tr)return;const p=PK.prof,id=(p.tail&&p.tails[p.tail])?p.tail:"";
 tr.mesh.visible=tr.soft.pts.visible=tr.star.pts.visible=!!id;
 if(!id){tr.hist.length=0;tr.id="";return}
 const st=TSTY[id],P=PK.P;if(tr.id!==id){tr.id=id;tr.hist.length=0;tr.soft.pts.material.size=tr.star.pts.material.size=st.ps}
 for(const h of tr.hist)h.a+=dt;while(tr.hist.length&&tr.hist[tr.hist.length-1].a>st.life)tr.hist.pop();
 const s=Math.sin(PK.ry),c=Math.cos(PK.ry),hx=P.x-s*.4,hy=P.y+.85,hz=P.z-c*.4,iv=st.life/(TN-3);
 tr.acc+=dt;tr.still=moving?0:tr.still+dt;
 if(moving&&tr.acc>=iv){tr.acc=0;tr.hist.unshift({x:hx,y:hy,z:hz,a:0});if(tr.hist.length>TN-1)tr.hist.pop()}
 const pts=[{x:hx,y:hy,z:hz,a:Math.min(st.life,tr.still)}].concat(tr.hist),n=Math.min(pts.length,TN),tm=PK.mt,pos=tr.pos,col=tr.col;
 for(let k=0;k<TN;k++){const i=Math.min(k,n-1),q=pts[i],u=Math.min(1,q.a/st.life),f=k>=n?0:Math.max(0,1-u),
   a=pts[Math.max(i-1,0)],b=pts[Math.min(i+1,n-1)];let dx=a.x-b.x,dz=a.z-b.z;const l=Math.hypot(dx,dz),hxv=l>1e-4?-dz/l:1,hzv=l>1e-4?dx/l:0,w=st.w*Math.pow(f,.7),
   cc=st.col(u,tm),m=Math.pow(f,1.3)*st.int,r=cc[0]*m,g=cc[1]*m,bl=cc[2]*m;
  let o=k*2*3;pos[o]=q.x+hxv*w;pos[o+1]=q.y;pos[o+2]=q.z+hzv*w;pos[o+3]=q.x-hxv*w;pos[o+4]=q.y;pos[o+5]=q.z-hzv*w;
  col[o]=col[o+3]=r;col[o+1]=col[o+4]=g;col[o+2]=col[o+5]=bl;
  o=(TN+k)*2*3;pos[o]=q.x;pos[o+1]=q.y+w*.9;pos[o+2]=q.z;pos[o+3]=q.x;pos[o+4]=q.y-w*.9;pos[o+5]=q.z;
  col[o]=col[o+3]=r;col[o+1]=col[o+4]=g;col[o+2]=col[o+5]=bl}
 tr.mesh.geometry.attributes.position.needsUpdate=true;tr.mesh.geometry.attributes.color.needsUpdate=true;tr.mesh.visible=n>=2&&pts[0].a<st.life;
 if(moving){tr.em+=st.rate*dt;while(tr.em>=1){tr.em-=1;const o=st.star&&Math.random()<.6?tr.star:tr.soft,pc=st.pc?st.pc[Math.floor(Math.random()*st.pc.length)]:hsl2rgb(Math.random(),1,.6),ang=Math.random()*6.283;
  trSpawn(o,hx+(Math.random()-.5)*.6,P.y+.2+Math.random()*1.5,hz+(Math.random()-.5)*.6,Math.cos(ang)*.5,.3+Math.random()*.7,Math.sin(ang)*.5,pc,.6+Math.random()*.5)}}
 trStep(tr.soft,dt);trStep(tr.star,dt)}

/* ===== GAME orientation: landscape only inside the game; app shell stays portrait ===== */
const LAND={on:false,rot:false};
function layoutApp(){
  const port=innerHeight>innerWidth,game=LAND.on,rotateApp=!game&&!port,rotateGame=game&&port;
  const root=document.documentElement;
  root.classList.toggle("land",game);
  const app=$("#app");
  if(app){
    if(game){app.style.cssText="display:none";}
    else if(rotateApp){
      app.style.cssText=`position:fixed;left:0;top:0;width:${innerHeight}px;height:${innerWidth}px;max-width:none;margin:0;transform-origin:0 0;transform:translateY(${innerHeight}px) rotate(-90deg);`;
    }else{app.style.cssText="";}
  }
  const gameCss=rotateGame?`position:fixed;left:0;top:0;width:${innerHeight}px;height:${innerWidth}px;max-width:none;margin:0;transform-origin:0 0;transform:translateX(${innerWidth}px) rotate(90deg);`+"z-index:9;":"z-index:9;";
  const appCss=rotateApp?`position:fixed;left:0;top:0;width:${innerHeight}px;height:${innerWidth}px;max-width:none;margin:0;transform-origin:0 0;transform:translateY(${innerHeight}px) rotate(-90deg);`+"z-index:9;":"z-index:9;";
  ["modal","modal2"].forEach((id,i)=>{const e=$("#"+id);if(e)e.style.cssText=game?gameCss:appCss.replace("z-index:9;",`z-index:${i?10:9};`)});

/* ---- MULTIPLAYER (real: everyone who has this page open in claude.ai, up to 20 per server) ---- */
const WS_URL="wss://gameset-server.onrender.com";
function wsRoom(code){return new Promise((res,rej)=>{
 let ws;try{ws=new WebSocket(WS_URL)}catch(e){return rej(e)}
 const peers=new Map(),cbs=[],room={};let done=false;
 const list=()=>[...peers].map(([id,p])=>({peer:"w"+id,kind:"viewer",isMe:false,presence:p}));
 const fire=()=>{const arr=list();cbs.forEach(f=>{try{f({peers:arr})}catch(e){}})};
 const fail=m=>{if(!done){done=true;try{ws.close()}catch(e){}rej(new Error(m))}};
 const to=setTimeout(()=>fail("timeout"),70000);
 ws.onopen=()=>ws.send(JSON.stringify({t:"join",room:code,p:{pk:1,n:S.name,g:S.gender,x:0,y:0,z:0,r:0,m:0,j:0}}));
 ws.onmessage=e=>{let m;try{m=JSON.parse(e.data)}catch(x){return}
  if(m.t==="joined"){clearTimeout(to);done=true;m.peers.forEach(x=>peers.set(x.id,x.p));res(room);fire()}
  else if(m.t==="full")fail("full");
  else if(m.t==="pres"){peers.set(m.id,m.p);fire()}
  else if(m.t==="left"){peers.delete(m.id);fire()}};
 ws.onerror=()=>fail("error");
 ws.onclose=()=>{if(!done)fail("close");else{peers.clear();fire()}};
 room.presence=p=>{if(ws.readyState===1)ws.send(JSON.stringify({t:"pres",p}));return Promise.resolve()};
 room.peers=list;room.onPeers=f=>{cbs.push(f)};
 room.leave=()=>{clearTimeout(to);try{ws.close()}catch(e){}return Promise.resolve()};
})}
async function joinServer(){
 try{
  for(let i=1;i<=8;i++){
   let nr;try{nr=await wsRoom("parkour-"+i)}catch(e){if(e.message==="full")continue;throw e}

 return SV.p=(async()=>{
  try{await netInit();SV.db=PK.db;SV.uid=PK.uid;SV.ok=!!(SV.db&&SV.uid)}catch(e){SV.ok=false}
  if(SV.ok){try{await svRefresh(true);svRegister()}catch(e){}}
  svBanner();svPaint();
  if(SV.ok)setInterval(()=>{svRefresh().catch(()=>{})},25000);
 })()}
async function svRefresh(first){

async function svLoadCfg(){const d=await svc("config").doc("app").get();
 if(d.exists){const v=d.data()||{};SV.adminUid=String(v.adminUid||"");SV.adminNick=String(v.adminNick||ADMIN_DEFAULT);SV.firstPlayerId=String(v.firstPlayerId||"")}else{SV.adminUid="";SV.adminNick=ADMIN_DEFAULT;SV.firstPlayerId=""}}
async function svRegister(){if(!SV.ok)return;
 try{
  const cfgRef=svc("config").doc("app"),userRef=svc("users").doc(SV.uid);
  const assigned=await SV.db.runTransaction(async tx=>{
   const pair=await Promise.all([tx.get(cfgRef),tx.get(userRef)]);
   const cfg=pair[0].exists?(pair[0].data()||{}):{};
   const u=pair[1].exists?(pair[1].data()||{}):{};
   let adminUid=String(cfg.adminUid||""),adminNick=String(cfg.adminNick||S.name||"GAMESET Admin");
   let firstPlayerId=String(cfg.firstPlayerId||"GS-000001");
   let nextPlayerNumber=Math.max(2,Number(cfg.nextPlayerNumber)||2);
   /* First successful account transaction owns the first ID and admin role. */
   if(!adminUid){adminUid=SV.uid;adminNick=S.name||"GAMESET Admin";firstPlayerId="GS-000001";}
   let playerId=String(u.playerId||"");
   if(SV.uid===adminUid)playerId="GS-000001";
   else if(u.idVersion!==2||!/^GS-\d{6}$/.test(playerId)){
    playerId="GS-"+String(nextPlayerNumber).padStart(6,"0");nextPlayerNumber++;
   }
   const old=Array.isArray(u.old)?u.old.slice(0,8):[];
   if(u.nick&&u.nick!==S.name&&!old.includes(u.nick))old.unshift(u.nick);
   tx.set(cfgRef,{adminUid,adminNick,firstPlayerId:"GS-000001",nextPlayerNumber,updatedAt:Date.now()},{merge:true});
   tx.set(userRef,{nick:S.name,g:S.gender,playerId,idVersion:2,role:SV.uid===adminUid?"admin":"player",old:old.slice(0,8),upd:Date.now()},{merge:true});
   return {adminUid,adminNick,playerId,firstPlayerId:"GS-000001"};
  });
  SV.adminUid=assigned.adminUid;SV.adminNick=assigned.adminNick;SV.firstPlayerId=assigned.firstPlayerId;SV.playerId=assigned.playerId;
  if(SV.uid===SV.adminUid)await alog("admin_claim",SV.uid,S.name,"Birinchi o‘yinchi · GS-000001");
 }catch(e){SV.playerId="";console.warn("svRegister",e)}
}

/* ---- ledger: balance is calculated from server records, never typed by the user ---- */
function calcLedger(rows,adminUid){let cl=0,pe=0;
 const l=rows.filter(r=>r.type==="spend"||(r.type==="grant"&&adminUid&&r.by===adminUid)).sort((a,b)=>(a.t||0)-(b.t||0));
 for(const r of l){if(r.cur==="cl")cl+=(r.type==="grant"?1:-1)*(+r.amt||0);
  else if(r.cur==="prem"&&r.type==="grant"){pe=addMonths(Math.max(pe,r.t||0),+r.months||0)}}
 return{cl:Math.max(0,Math.round(cl)),pe}}
async function ledgerOf(uid){const s=await svc("ledger").where("uid","==",uid).get();return s.docs.map(d=>({id:d.id,...d.data()}))}
async function svLoadLedger(){SV.led=await ledgerOf(SV.uid);svCalc()}
function svCalc(){const c=calcLedger(SV.led,SV.adminUid);S.gems=c.cl;SV.premEnd=c.pe;S.premium=c.pe>Date.now();svPaint()}
function spendCL(n,ref){
 if(!SV.ok||!(n>=0)||S.gems<n)return false;
 const id=rid("s"),r={uid:SV.uid,type:"spend",cur:"cl",amt:n,ref:ref||"",by:SV.uid,t:Date.now()};
 SV.led.push({id,...r});svCalc();
 svc("ledger").doc(id).set(r).catch(()=>{SV.led=SV.led.filter(x=>x.id!==id);svCalc();render();appToast("Server xatosi: CL yechilmadi")});
 return true}

 let item,price,amt;
 if(kind==="cl"){const k=PACKS[key];if(!k)return;item=k[0]+" CL";price=k[1];amt=k[0]}
 else{const p=PLANS.find(x=>x.id===key);if(!p)return;item="Premium · "+p.name;price=p.price;amt=PMONTHS[p.id]}
 const id=rid("o"),no="GS-"+new Date().toISOString().slice(2,10).replace(/-/g,"")+"-"+Math.random().toString(36).slice(2,6).toUpperCase();
 const o={uid:SV.uid,nick:S.name,kind,item,amt,price,no,status:"new",t:Date.now(),upd:Date.now()};
 try{await svc("orders").doc(id).set(o);

  SV.orders.unshift({id,...o});
 }catch(e){return info("Buyurtma yuborilmadi","Server xatosi. Keyinroq urinib ko‘ring. Hech qanday pul yechilmadi.")}
 closeM();closeM2();S.tab="chat";S.chat="o:"+id;S.dir="r";render(true)}

async function orderImg(inp){const f=inp.files[0];inp.value="";if(!f||!ORM.o)return;
 try{const d=await imgCompress(f);await orderMsg(ORM.id,ORM.adm?"a":"u","",d);
  if(!ORM.adm&&["new","awaiting","receipt"].includes(ORM.o.status)){await svc("orders").doc(ORM.id).update({status:"receipt",upd:Date.now()});
   await orderMsg(ORM.id,"s","Chek rasmi yuborildi. Admin to‘lovni tekshiradi.")}
 }catch(e){appToast("Rasm yuborilmadi");return}ORM.cs="";orderPaint()}
function imgCompress(file,max=900,q=.62){return new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{
 const k=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=Math.max(1,Math.round(im.width*k));c.height=Math.max(1,Math.round(im.height*k));
 c.getContext("2d").drawImage(im,0,0,c.width,c.height);let qq=q,d=c.toDataURL("image/jpeg",qq);while(d.length>220000&&qq>.3){qq-=.1;d=c.toDataURL("image/jpeg",qq)}res(d)};im.onerror=rej;im.src=fr.result};fr.onerror=rej;fr.readAsDataURL(file)})}

async function admUser(uid){if(!await admGuard())return;
 try{const d=await svc("users").doc(uid).get(),u=d.exists?d.data():{nick:"?"},c=calcLedger(await ledgerOf(uid),SV.adminUid);
  sheet(`<h3>${esc(u.nick||"?")}</h3><p style="word-break:break-all">Akkaunt ID: ${esc(uid)}</p><p>CL balans: <b>${nf(c.cl)}</b><br>Premium: <b>${c.pe>Date.now()?"faol, tugash sanasi "+fmtD(c.pe):"yo‘q"}</b></p><button class="btn" onclick="admGiveCL('${esc(uid)}')">CL berish</button><button class="btn" onclick="admGivePrem('${esc(uid)}')">Premium berish</button><button class="btn sec" onclick="closeM()">Yopish</button>`)}catch(e){info("Xatolik","Foydalanuvchi o‘qilmadi.")}}
function admGiveCL(uid){sheet(`<h3>CL berish</h3><p>Miqdorni yozing (1 – 100 000).</p><input id="gcl" type="number" inputmode="numeric" min="1" max="100000" placeholder="Masalan 80"><button class="btn" id="gcok">Tasdiqlash</button><button class="btn sec" onclick="admUser('${esc(uid)}')">Orqaga</button>`);
 $("#gcok").onclick=async()=>{const n=Math.floor(+$("#gcl").value);if(!(n>=1&&n<=100000))return appToast("Miqdor 1 dan 100 000 gacha");if(AD.busy)return;AD.busy=true;
  try{if(!await admGuard())return;const d=await svc("users").doc(uid).get(),nick=d.exists?d.data().nick:"?";
   await svc("ledger").doc(rid("g")).set({uid,type:"grant",cur:"cl",amt:n,by:SV.uid,ref:"manual",t:Date.now()});
   await alog("grant_cl",uid,nick,n+" CL");closeM();appToast(nick+" ga "+n+" CL berildi")}catch(e){closeM();info("Xatolik","Berilmadi. Server xatosi.")}finally{AD.busy=false}}}
function admGivePrem(uid){sheet(`<h3>Premium berish</h3><div id="pm">${[["1 oy",1],["3 oy",3],["1 yil",12]].map(([l,m],i)=>`<button class="btn sec pmb ${i?"":"on"}" data-m="${m}" onclick="document.querySelectorAll('.pmb').forEach(x=>x.classList.remove('on'));this.classList.add('on')">${l}</button>`).join("")}</div><button class="btn" id="gpok">Faollashtirish</button><button class="btn sec" onclick="admUser('${esc(uid)}')">Orqaga</button>`);
 $("#gpok").onclick=async()=>{const m=+(document.querySelector(".pmb.on")||{dataset:{m:1}}).dataset.m;if(AD.busy)return;AD.busy=true;
  try{if(!await admGuard())return;const d=await svc("users").doc(uid).get(),nick=d.exists?d.data().nick:"?",t=Date.now();
   await svc("ledger").doc(rid("g")).set({uid,type:"grant",cur:"prem",months:m,by:SV.uid,ref:"manual",t});
   const c=calcLedger(await ledgerOf(uid),SV.adminUid);await alog("grant_prem",uid,nick,m+" oy · tugaydi "+fmtD(c.pe));
   closeM();info("Premium faollashtirildi",esc(nick)+": tugash sanasi <b>"+fmtD(c.pe)+"</b>")}catch(e){closeM();info("Xatolik","Berilmadi. Server xatosi.")}finally{AD.busy=false}}}
/* manage + history */
async function admManage(b){
 const s=await svc("alog").limit(300).get(),L=s.docs.map(d=>d.data()).sort((a,b)=>b.t-a.t),all=await allOrders();
 const ACT={grant_cl:"CL berildi",grant_prem:"Premium berildi",order_confirm:"Buyurtma tasdiqlandi",order_reject:"Buyurtma rad etildi",order_card:"Karta yuborildi",admin_nick:"Admin niki o‘zgardi",admin_claim:"Admin belgilandi"};
 const gv=L.filter(x=>["grant_cl","grant_prem","order_confirm"].includes(x.act));
 b.innerHTML=`<div class="hero dk"><b>Admin niki: ${esc(SV.adminNick)}</b><button class="btn sec sm" style="margin-top:8px" onclick="admNick()">Nikni o‘zgartirish</button></div>
 <div class="st">Kimga qancha CL / Premium berilgan</div>${gv.length?gv.slice(0,60).map(x=>`<div class="row"><div class="g"><b>${esc(x.toNick||"?")} · ${esc(ACT[x.act]||x.act)}</b><small>${esc(x.detail)} · ${fmtDT(x.t)}</small></div></div>`).join(""):`<p class="empty">Hali yo‘q.</p>`}
 <div class="st">Buyurtmalar tarixi</div>${all.length?all.slice(0,80).map(o=>`<div class="row" onclick="AD.oid='${o.id}';render()"><div class="g"><b>${esc(o.no)} · ${esc(o.nick)}</b><small>${esc(o.item)} · ${fmt(o.price)} · ${fmtDT(o.t)}</small></div>${stChip(o.status)}</div>`).join(""):`<p class="empty">Hali yo‘q.</p>`}
 <div class="st">Amallar jurnali</div>${L.length?L.slice(0,80).map(x=>`<div class="row"><div class="g"><b>${esc(ACT[x.act]||x.act)}</b><small>${esc(x.byNick||"")} → ${esc(x.toNick||"-")} · ${esc(x.detail||"")} · ${fmtDT(x.t)}</small></div></div>`).join(""):`<p class="empty">Hali yo‘q.</p>`}`}
function admNick(){sheet(`<h3>Admin nikini o‘zgartirish</h3><input id="ank" maxlength="16" value="${esc(SV.adminNick)}"><button class="btn" id="ankok">Saqlash</button><button class="btn sec" onclick="closeM()">Bekor qilish</button>`);
 $("#ankok").onclick=async()=>{const v=$("#ank").value.trim();if(!v)return;if(!await admGuard())return;
  try{await svc("config").doc("app").update({adminNick:v});S.name=v;save();await svRegister();await svLoadCfg();await alog("admin_nick",SV.uid,v,"yangi nik: "+v);closeM();render()}catch(e){closeM();info("Xatolik","Saqlanmadi.")}}}
function adminProfileBtn(){
 if(!SV.ok)return "";
 if(isAdmin())return `<button class="btn rv" onclick="openAdmin()">Admin panel</button>`;
 return "";
}

/* ---- Parkour leaderboard rows (shown only inside Rainbow Parkour) ---- */
function ratRows(tab,docs){
 return docs.length?docs.map((d,i)=>`<div class="row ${d.id===PK.uid?"mine":""}"><b class="rk r${i<3?i+1:0}">${i+1}</b><img src="${CI[CI[d.g]?d.g:"boy"].head}" width="38" height="38" alt="" style="border-radius:10px;background:linear-gradient(160deg,#6d28d9,#22d3ee);object-fit:cover"><div class="g"><b>${esc(String(d.name||"Player").slice(0,16))}</b><small>Eng yaxshi: ${d.best?fmtT(d.best):"-"} · Tugatgan: ${d.count||0}${tab==="rb"?" · Level "+(d.lv||1):""}</small></div><b style="color:var(--cy)">${BV[tab](d)}</b></div>`).join(""):`<p class="empty">Hali hech kim yo‘q. Birinchi bo‘ling!</p>`}

  const d=await svc("wheel").doc(SV.uid).get(),cur=d.exists?d.data():{last:0},now=Date.now();         /* fresh read of the stored time */
  if(cur.last&&now-cur.last<DAY){SV.wheel=cur;PK.spinBusy=false;return wheelSheet()}
  if(cur.pend){SV.wheel=cur;await wheelClaim();PK.spinBusy=false;return info("Oldingi sovrin","Oldingi aylantirishdagi sovrin hisobingizga qo‘shildi.")}
  const i=wheelPick(),s=WSEG[i],rec={last:now,prize:s.k,pend:1,n:(+cur.n||0)+1,nick:S.name,carpetUntil:cur.carpetUntil||0};
  await svc("wheel").doc(SV.uid).set(rec);                                                              /* time + result saved on the server BEFORE the animation */
  const chk=await svc("wheel").doc(SV.uid).get();if(!chk.exists||chk.data().last!==now){PK.spinBusy=false;return info("Xatolik","Aylantirish tasdiqlanmadi. Qayta urinib ko‘ring.")}
  SV.wheel=rec;closeM();clearInterval(PK.wtm);
  const w=PK.wh.w,c0=w.rotation.z,want=(((Math.PI/2-(i*Math.PI/3+Math.PI/6)+(Math.random()-.5)*Math.PI/3*.7)%(Math.PI*2))+Math.PI*2)%(Math.PI*2),cm=((c0%(Math.PI*2))+Math.PI*2)%(Math.PI*2);
  WSP.from=c0;WSP.to=c0+Math.PI*2*6+((want-cm+Math.PI*2)%(Math.PI*2));WSP.t=0;WSP.on=true;navigator.vibrate&&navigator.vibrate(30);
  WSP.done=async()=>{await wheelClaim();PK.spinBusy=false;
   burst(WHL.x-3,WHL.cy,WHL.z-1.5,[0xfde047,0xf43f5e,0x22d3ee,0xffffff],70,8,10);ringFx(WHL.x,.3,WHL.z,0xfde047);
   const txt=s.kub?"+"+nf(s.kub)+" 🏆 hisobingizga qo‘shildi!":"START tugmasini bosganingizda 60 soniyalik uchish boshlanadi. Sakrash tugmasini bosib turing.";
   toast(s.kub?"Yutuq: "+s.t:"Yutuq: Flying Carpet");
   sheet(`<div class="ctr"><h3>Tabriklaymiz!</h3><div style="font-size:46px;margin:6px 0">${s.kub?"🏆":`<img src="${CARPET_ART}" alt="Flying Carpet" style="width:120px;height:120px;object-fit:contain;border-radius:50%">`}</div><p><b style="font-size:20px">${s.k==="carpet"?"Uchar gilam · 1 daqiqa":s.t}</b></p><p>${txt}</p><p style="color:var(--mut);font-size:12px">Keyingi bepul aylantirish 24 soatdan keyin.</p></div><button class="btn" onclick="closeM()">OK</button>`)}
 }catch(e){PK.spinBusy=false;WSP.on=false;info("Xatolik","Server xatosi. Aylantirish bajarilmadi.")}}

$("#clic").innerHTML=ic("crystal",24);$("#bell").innerHTML=ic("bell",28);
loadLocal();render(true);layoutApp();addEventListener("resize",layoutApp);addEventListener("orientationchange",()=>setTimeout(layoutApp,250));
svInit().then(()=>{if(S.tab==="profile"||S.tab==="chat")render()});
